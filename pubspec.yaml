name: nulisin
description: "Nulisin - Premium Article Sharing App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  go_router: ^14.6.3
  shared_preferences: ^2.3.2
  # Backend
  supabase_flutter: ^2.8.4
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  flutter_markdown: ^0.7.7+1
  url_launcher: ^6.3.2
  flutter_quill: ^11.5.0
  markdown_quill: ^4.3.0
  flutter_quill_extensions: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
